<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="iMbrace Chat Widget"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <script>
      // Check if config is already passed via URL params
      const urlParams = new URLSearchParams(window.location.search);
      const configFromUrl = urlParams.get('config');

      if (configFromUrl) {
        // Config passed via URL (from full_page.html)
        try {
          window.env = JSON.parse(decodeURIComponent(configFromUrl));
          console.log('Config loaded from URL:', window.env);
        } catch (error) {
          console.error('Failed to parse config from URL:', error);
          window.env = {};
        }
      } else {
        // Direct access, fetch config
        fetch('/config')
            .then(res => res.json())
            .then(config => {
              window.env = config;
              console.log('Config fetched directly:', config);
            })
            .catch(err => {
              console.error('Failed to load /config:', err);
              window.env = {};
            });
      }
    </script>
    <script>
      window.env = {
          VITE_APP_ON_LOCAL_STORAGE: "%VITE_APP_ON_LOCAL_STORAGE%"
      };
      setTimeout(() => { 
        document.documentElement.setAttribute("local-storage-env", window.env.VITE_APP_ON_LOCAL_STORAGE);
          if (window.env.VITE_APP_ON_LOCAL_STORAGE === 'true') {
              document.addEventListener("DOMContentLoaded", function () {
                const link = document.createElement("link");
                link.rel = "stylesheet";
                link.href = "./localResources/local-resource-font.css";
                document.head.appendChild(link);
              });
          } else {
            const head = document.head || document.getElementsByTagName("head")[0];

            const link1 = document.createElement("link");
            link1.rel = "preconnect";
            link1.href = "https://fonts.googleapis.com";

            const link2 = document.createElement("link");
            link2.rel = "preconnect";
            link2.href = "https://fonts.gstatic.com";
            link2.crossOrigin = "anonymous";

            const link3 = document.createElement("link");
            link3.rel = "stylesheet";
            link3.href = "https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap";

            head.appendChild(link1);
            head.appendChild(link2);
            head.appendChild(link3);
          }
      },100)
     
    </script>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>iMbrace Chat Widget</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

  </body>
</html>
